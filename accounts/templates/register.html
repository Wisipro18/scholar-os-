{% extends 'auth_base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">

    <div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md text-white">

        <h2 class="text-3xl font-bold text-center mb-6">Create Account</h2>

        {% if messages %}
    {% for message in messages %}
        <div class="bg-red-500 text-white p-2 rounded mb-2">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username"
                class="w-full p-2 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

            <input type="email" name="email" placeholder="Email"
                class="w-full p-2 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

            <input type="password" name="password1" placeholder="Password"
                class="w-full p-2 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

            <input type="password" name="password2" placeholder="Confirm Password"
                class="w-full p-2 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

            <button type="submit"
                class="w-full bg-white text-indigo-600 font-semibold py-3 rounded-lg hover:scale-105 transition">
                Register
            </button>
        </form>

        <p class="text-center text-sm mt-4">
            Already have an account?
            <a href="/login/" class="underline">Login</a>
        </p>

    </div>

</div>

{% endblock %}
