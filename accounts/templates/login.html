{% extends 'auth_base.html' %}

{% block content %}

<div class="flex items-center justify-center min-h-[80vh]">

    <form method="POST"
          class="w-96 bg-[#1e293b] p-8 rounded-xl shadow border border-gray-700">

        {% csrf_token %}

        <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>

        <input type="text" name="username" placeholder="Username"
               class="w-full p-2 mb-3 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

        <input type="password" name="password" placeholder="Password"
               class="w-full p-2 mb-3 rounded bg-[#0f172a] border border-gray-600 text-white placeholder-gray-400">

        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded transition">
            Login
        </button>

        <p class="text-center mt-4 text-sm text-gray-400">
            Don't have an account?
            <a href="/register/" class="text-blue-400">Register</a>
        </p>

    </form>

</div>

{% endblock %}
