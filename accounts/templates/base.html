<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarOS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system;
        }
    </style>
</head>

<body class="bg-[#0f172a] text-gray-100">

<div class="flex flex-col md:flex-row min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 md:fixed md:left-0 md:top-0 md:h-full bg-[#111827] border-r border-gray-800 px-6 py-6">

        <h1 class="text-xl font-bold mb-6">
            📚 ScholarOS
        </h1>

        <nav class="flex md:block gap-3 overflow-x-auto md:overflow-visible text-sm">

            <a href="/" class="block px-3 py-2 rounded hover:bg-gray-800">🏠 Dashboard</a>
            <a href="/cgpa/" class="block px-3 py-2 rounded hover:bg-gray-800">📊 CGPA</a>
            <a href="/calendar/" class="block px-3 py-2 rounded hover:bg-gray-800">📅 Calendar</a>
            <a href="/pomodoro/" class="block px-3 py-2 rounded hover:bg-gray-800">⏱ Pomodoro</a>

            <a href="/logout/" class="block px-3 py-2 rounded text-red-400 hover:bg-red-900 mt-4">
                🚪 Logout
            </a>

        </nav>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 md:ml-64 p-4 md:p-10">

        {% block content %}{% endblock %}

    </main>

</div>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        duration: 700,
        once: true
    });
</script>

</body>
</html>
